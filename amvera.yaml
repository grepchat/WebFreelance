# https://docs.amvera.ru/applications/configuration/config-file.html
# Секции meta / build / run обязательны для валидации на Amvera.
meta:
  environment: docker
  toolchain:
    name: docker

build:
  dockerfile: Dockerfile
  skip: false

run:
  persistenceMount: /data
  containerPort: 3000
  servicePort: 80
