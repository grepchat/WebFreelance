<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#g)"/>
  <!-- Angle bracket < -->
  <text x="92" y="72" font-size="48" text-anchor="end" fill="white" font-family="monospace" font-weight="bold" opacity="0.35">&lt;</text>
  <!-- / -->
  <text x="65" y="72" font-size="48" text-anchor="middle" fill="white" font-family="monospace" font-weight="bold" opacity="0.35">/</text>
  <!-- > -->
  <text x="92" y="72" font-size="48" text-anchor="start" fill="white" font-family="monospace" font-weight="bold" opacity="0.35">&gt;</text>
  <!-- G letter -->
  <text x="52" y="72" font-size="48" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="bold">G</text>
</svg>